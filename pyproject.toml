[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfg-planificacion-gastronomica"
version = "0.5.0"
description = "Pronóstico de ventas y planificación de insumos gastronómicos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy==2.3.5", "scikit-learn==1.9.1"]

[project.scripts]
planificacion = "planificacion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planificacion = ["recursos/*.json"]
